<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SERVICI wireframes</title>
<style>body{margin:0}.s{box-sizing:border-box;padding:20px;background:#fff;border:1px solid #bbb;font:14px system-ui,sans-serif;color:#222;display:flex;flex-direction:column;gap:12px}.ph{width:390px;height:844px}.dk{width:900px;height:560px;flex-direction:row;padding:0;gap:0}.b{background:#e6e6e6;border:1px dashed #999;border-radius:6px}.c{border:1px solid #bbb;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}.p{background:#4a4a4a;color:#fff;border:0;border-radius:8px;min-height:44px;padding:0 14px;font:600 14px system-ui}.o{background:#fff;color:#222;border:1px solid #888;border-radius:8px;min-height:44px;padding:0 14px;font:14px system-ui}.sm{min-height:36px}.r{display:flex;gap:8px;align-items:center}.m{color:#555;font-size:12px}label{min-width:0;display:block}h2{margin:0;font-size:18px}.t{display:flex;justify-content:space-around;border-top:1px solid #bbb;padding-top:10px;margin-top:auto;font-size:12px}.i{display:block;width:100%;box-sizing:border-box;border:1px solid #888;border-radius:6px;padding:12px;margin-top:4px;color:#555;font:14px system-ui;background:#fff}.g{flex:1}.tg{background:#e6e6e6;border-radius:12px;padding:4px 10px;font-size:12px}.sd{width:180px;border-right:1px solid #bbb;padding:16px;display:flex;flex-direction:column;gap:4px;box-sizing:border-box}.sd a{padding:12px;color:#222;text-decoration:none;border-radius:6px}.sd a.on{background:#e6e6e6;font-weight:600}.mn{flex:1;padding:20px;display:flex;flex-direction:column;gap:12px}.st{flex:1;border:1px solid #bbb;border-radius:8px;padding:12px}.st b{display:block;font-size:24px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #ddd;font-size:13px}.ph{overflow-y:auto}.col{display:flex;flex-direction:column;gap:8px;flex:1}.tb{background:none;border:0;font:12px system-ui;min-height:44px;color:#555;padding:0 4px}.tb.on{font-weight:700;color:#4a4a4a}.dn{background:#4a4a4a;color:#fff}.bb{padding:8px 12px;border-radius:12px;max-width:75%;background:#e6e6e6}.me{align-self:flex-end;background:#4a4a4a;color:#fff}a.p,a.o{display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}.sd button{text-align:left;padding:12px;border:0;background:none;border-radius:6px;font:14px system-ui;min-height:44px;color:#222}.sd .on{background:#e6e6e6;font-weight:600}.rw{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #ddd}.mn{overflow-y:auto}.ch{display:flex;align-items:flex-end;gap:10px;height:128px;padding-top:6px}.cg{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}.bars{display:flex;align-items:flex-end;gap:4px;height:100px;border-bottom:1px solid #bbb}.bw{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}.bw span{font-size:10px;color:#555}.bar{width:16px;border-radius:3px 3px 0 0;min-height:2px}.lgd{display:flex;gap:12px;font-size:12px;color:#555}.lgd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}.bdg{background:#4a4a4a;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:6px}.ok{background:#e6e6e6;border-radius:8px;padding:12px;font-size:13px}
body{background:#f3f3f3;margin:0;font-family:system-ui,sans-serif}
.hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 24px;background:#fff;border-bottom:1px solid #ddd;font:14px system-ui}
.logo{display:flex;align-items:center;gap:8px}.lg{width:28px;height:28px;border-radius:8px;background:#4a4a4a;color:#fff;display:grid;place-items:center;font-weight:700}
.logo i{color:#555;font-size:12px;font-style:normal}
.seg{display:flex;gap:4px;background:#eee;padding:4px;border-radius:10px;margin-left:auto}
.seg a{padding:8px 14px;border-radius:8px;color:#222;text-decoration:none;font-weight:600;font-size:13px}
.seg a[data-on]{background:#4a4a4a;color:#fff}
.stage{display:flex;flex-direction:column;align-items:center;padding:40px 16px 32px;overflow-x:auto}
body{background:#efedec}body.d{background:linear-gradient(135deg,#f4f5f6,#dcdde0)}
#device{position:relative;box-sizing:content-box}
.phone{width:390px;padding:13px;background:#0e0e10;border-radius:60px;border:3px solid #5b3f5e;box-shadow:inset 0 0 0 2px #2a2a2e}
.phone #app{border-radius:46px;overflow:hidden;background:#fff}
.phone .ph{padding-top:50px;padding-bottom:24px}
.notch{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:116px;height:32px;background:#000;border-radius:20px;z-index:2}
.notch::after{content:"";position:absolute;right:12px;top:12px;width:8px;height:8px;border-radius:50%;background:#1b2a5c}
.sb{position:absolute;width:4px;background:#4a3350;border-radius:2px}
.s1{left:-7px;top:110px;height:30px}.s2{left:-7px;top:170px;height:56px}.s3{left:-7px;top:240px;height:56px}.s4{right:-7px;top:200px;height:90px}
.desk{width:900px;padding:22px 14px 16px;background:#0b0b0c;border:1px solid #3a3a3d;border-radius:16px 16px 4px 4px;margin-bottom:24px}
.desk #app{background:#fff;overflow:hidden}
.desk::before{content:"";position:absolute;top:8px;left:50%;width:6px;height:6px;border-radius:50%;background:#2a2a2e}
.desk::after{content:"";position:absolute;left:-60px;right:-60px;top:100%;height:14px;background:linear-gradient(#4d4d50,#2a2a2d);border-radius:0 0 24px 24px;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.home{display:none}.desk .home{display:block;position:absolute;top:100%;left:50%;transform:translateX(-50%);width:130px;height:6px;background:#1d1d1f;border-radius:0 0 10px 10px;z-index:3}
.phone .s1,.phone .s2,.phone .s3,.phone .s4{display:block}.desk .sb,.desk .notch{display:none}
#sh{width:260px;height:22px;margin-top:18px;background:radial-gradient(ellipse at center,rgba(0,0,0,.35),transparent 70%);filter:blur(4px)}
body.d #sh{width:760px;margin-top:20px}</style></head><body>
<header class="hd"><div class="logo"><span class="lg">S</span><b>SERVICI</b><i>Wireframes</i></div>
<nav class="seg"><a data-g="welcome" href="#welcome">Welcome</a><a data-g="seeker" href="#seeker">Service Seeker</a><a data-g="provider" href="#provider">Service Provider</a><a data-g="admin" href="#admin">Administrator</a></nav></header>
<main class="stage"><div id="device" class="phone"><i class="sb s1"></i><i class="sb s2"></i><i class="sb s3"></i><i class="sb s4"></i><div class="notch"></div><div id="app"></div><div class="home"></div></div><div id="sh"></div></main>
<template id="t-welcome">
<div class="s ph"><h2 style="font-size:28px;margin-top:24px">SERVICI</h2><span class="m">Find or offer small paid jobs in Tunisia.</span>
<label class="m">Full name<input class="i" placeholder="Your name"></label>
<label class="m">Email<input class="i" placeholder="name@email.com"></label>
<label class="m">Password<input class="i" type="password" placeholder="Password"></label>
<b>I am joining as</b>
<a class="p" href="#seeker">Service Seeker: I need a service</a>
<a class="o" href="#provsetup">Service Provider: I offer my skills</a>
<a class="o" href="#adminlogin">Administrator</a>
<span class="m" style="margin-top:auto;text-align:center">Already have an account? Log in</span></div>
</template>
<template id="t-provsetup">
<div class="s ph"><h2>Set up your provider profile</h2>
<div class="r"><div class="b" style="width:64px;height:64px"></div><span class="m">Add a profile picture</span></div>
<label class="m">Skills<input class="i" placeholder="Cleaning, tutoring, design..."></label>
<label class="m">Experience<textarea class="i" rows="2" placeholder="Short summary"></textarea></label>
<label class="m">Education<input class="i" placeholder="Diploma, school"></label>
<label class="m">Location<input class="i" placeholder="City, area"></label>
<label class="m">Availability<select class="i"><option>Weekdays</option></select></label>
<a class="p" href="#provider" style="margin-top:auto">Save and continue</a></div>
</template>
<template id="t-adminlogin">
<div class="s dk" style="align-items:center;justify-content:center"><div class="c" style="width:340px;gap:12px"><h2>Administrator login</h2>
<label class="m">Email<input class="i" placeholder="admin@servici"></label>
<label class="m">Password<input class="i" type="password" placeholder="Password"></label>
<a class="p" href="#admin">Log in</a></div></div>
</template>
<template id="t-seeker">
<div class="s ph">
<div class="r"><b class="g">SERVICI</b><button class="o sm" onClick="{{ g.notif }}">Alerts 2</button></div>
<sc-if value="{{ v.home }}" hint-placeholder-val="{{ true }}">
<h2>My requests</h2>
<div class="r"><sc-for list="{{ fl }}" as="x" hint-placeholder-count="4"><button class="{{ x.cls }} g sm" onClick="{{ x.pick }}">{{ x.n }}</button></sc-for></div>
<div class="r"><label class="m g">Category<select class="i" data-ctl="1" onChange="{{ setCat }}"><sc-for list="{{ catOpts }}" as="o" hint-placeholder-count="7"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.v }}</option></sc-for></select></label><label class="m g">Sort by<select class="i" data-ctl="1" onChange="{{ setSrt }}"><sc-for list="{{ srtOpts }}" as="o" hint-placeholder-count="4"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.v }}</option></sc-for></select></label></div>
<sc-for list="{{ rl }}" as="r" hint-placeholder-count="3"><div class="c"><div class="r"><b class="g">{{ r.t }}</b><span class="tg">{{ r.st }}</span></div><span class="m">{{ r.c }} · {{ r.m }} · {{ r.p }} TND</span><sc-if value="{{ r.rated }}" hint-placeholder-val="{{ false }}"><span class="m">Your review: {{ r.rv }}/5</span></sc-if><button class="o" onClick="{{ r.go }}">{{ r.lab }}</button></div></sc-for>
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><span class="m">No requests match these filters.</span></sc-if>
<button class="p" onClick="{{ g.publish }}">+ Publish a request</button>
</sc-if>
<sc-if value="{{ v.publish }}" hint-placeholder-val="{{ false }}">
<div class="r"><button class="o sm" onClick="{{ g.home }}">Back</button><h2 class="g">New request</h2></div>
<label class="m">Title<input class="i" placeholder="e.g. Home cleaning" value="{{ title }}" onChange="{{ setTitle }}"></label>
<label class="m">Category<select class="i" data-ctl="1" onChange="{{ setFormCat }}"><sc-for list="{{ fcOpts }}" as="o" hint-placeholder-count="6"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.v }}</option></sc-for></select></label>
<label class="m">Description<textarea class="i" rows="2" placeholder="Describe the task"></textarea></label>
<label class="m">Location<input class="i" placeholder="City, area"></label>
<div class="r"><label class="m g">Budget (TND)<input class="i" placeholder="0" value="{{ formP }}" onChange="{{ setP }}"></label><label class="m g">Payment<select class="i"><option>Fixed</option></select></label></div>
<div class="r"><label class="m g">Date<input class="i" placeholder="DD/MM"></label><label class="m g">Deadline<input class="i" placeholder="DD/MM"></label></div>
<div class="b" style="padding:12px;text-align:center">Add photos or attachments</div>
<button class="p" onClick="{{ publish }}">Publish request</button>
</sc-if>
<sc-if value="{{ v.apps }}" hint-placeholder-val="{{ false }}">
<div class="r"><button class="o sm" onClick="{{ g.home }}">Back</button><h2 class="g">Applications</h2></div>
<span class="m">Home cleaning · 3 providers applied</span>
<sc-for list="{{ al }}" as="a" hint-placeholder-count="3"><div class="c"><div class="r"><b class="g">{{ a.n }}</b><span class="tg">{{ a.st }}</span></div><span class="m">Rating {{ a.r }} · {{ a.p }} TND · {{ a.t }}</span><div class="r"><button class="o g sm" onClick="{{ g.chat }}">Message</button><sc-if value="{{ a.pending }}" hint-placeholder-val="{{ true }}"><button class="p g sm" onClick="{{ a.accept }}">Accept</button><button class="o g sm" onClick="{{ a.reject }}">Reject</button></sc-if></div></div></sc-for>
</sc-if>
<sc-if value="{{ v.track }}" hint-placeholder-val="{{ false }}">
<h2>Booking: Logo design</h2><span class="m">Provider: [Name] · due 30 Nov · 150 TND</span>
<div class="r" style="flex-wrap:wrap"><sc-for list="{{ steps }}" as="p" hint-placeholder-count="4"><span class="{{ p.cls }}">{{ p.n }}</span></sc-for></div>
<div class="c"><b>Work status</b><span class="m">{{ banner }}</span></div>
<div class="c"><b>Payment</b><span class="m">Agreed price: 150 TND · Status: {{ payTxt }}</span></div>
<div class="c"><b>History</b><span class="m">Booked 20 Nov · Completed tasks: 1</span></div>
<sc-if value="{{ showAdv }}" hint-placeholder-val="{{ true }}"><button class="p" onClick="{{ adv }}">{{ lab }}</button></sc-if>
</sc-if>
<sc-if value="{{ v.rate }}" hint-placeholder-val="{{ false }}">
<h2>Review the service</h2><span class="m">Logo design · [Provider name] · work finished</span>
<div class="r"><sc-for list="{{ stars }}" as="x" hint-placeholder-count="5"><button class="{{ x.cls }} g" onClick="{{ x.pick }}">{{ x.n }}</button></sc-for></div>
<span class="m">{{ starTxt }}</span>
<label class="m">Comment<textarea class="i" rows="4" placeholder="Share your feedback"></textarea></label>
<button class="o" onClick="{{ rf.open }}">Report inappropriate behaviour</button>
<button class="p" onClick="{{ submitRate }}">Submit review</button>
</sc-if>
<sc-if value="{{ v.chat }}" hint-placeholder-val="{{ false }}">
<div class="r"><h2 class="g">Messages · [Provider A]</h2><button class="o sm" onClick="{{ rf.open }}">Report</button></div>
<div class="col"><sc-for list="{{ ml }}" as="m" hint-placeholder-count="2"><div class="{{ m.cls }}">{{ m.t }}</div></sc-for></div>
<div class="r"><input class="i g" style="margin:0" placeholder="Write a message" value="{{ draft }}" onChange="{{ setDraft }}"><button class="p" onClick="{{ send }}">Send</button></div>
</sc-if>
<sc-if value="{{ v.profile }}" hint-placeholder-val="{{ false }}">
<h2>My profile</h2><span class="tg" style="align-self:flex-start">Service Seeker</span>
<div class="r"><div class="b" style="width:64px;height:64px"></div><b class="g">[Your name]</b></div>
<label class="m">Location<input class="i" placeholder="City, area"></label>
<div class="c"><b>Activity and account history</b><span class="m">3 requests published · 1 completed · 1 review given</span></div>
<a class="o" href="#welcome">Log out</a>
</sc-if>
<sc-if value="{{ v.report }}" hint-placeholder-val="{{ false }}">
<div class="r"><button class="o sm" onClick="{{ rf.back }}">Back</button><h2 class="g">Report a problem</h2></div>
<sc-if value="{{ rf.sent }}" hint-placeholder-val="{{ false }}"><div class="ok"><b>Report sent.</b><br>Thank you. An administrator will review it and take action if needed.</div><button class="p" onClick="{{ rf.back }}">Done</button></sc-if>
<sc-if value="{{ rf.form }}" hint-placeholder-val="{{ true }}">
<span class="m">Your report goes directly to the SERVICI administrators.</span>
<label class="m">Who are you reporting?<select class="i" data-ctl="1" onChange="{{ rf.setT }}"><sc-for list="{{ rf.tOpts }}" as="o" hint-placeholder-count="3"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.v }}</option></sc-for></select></label>
<label class="m">Reason<select class="i" data-ctl="1" onChange="{{ rf.setR }}"><sc-for list="{{ rf.rOpts }}" as="o" hint-placeholder-count="5"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.v }}</option></sc-for></select></label>
<label class="m">Details<textarea class="i" rows="5" placeholder="Describe what happened" value="{{ rf.d }}" onChange="{{ rf.setD }}"></textarea></label>
<sc-if value="{{ rf.err }}" hint-placeholder-val="{{ false }}"><span class="m" style="color:#a00">Please describe what happened before sending.</span></sc-if>
<button class="p" style="margin-top:auto" onClick="{{ rf.submit }}">Submit report</button>
</sc-if>
</sc-if>
<sc-if value="{{ v.notif }}" hint-placeholder-val="{{ false }}">
<div class="r"><button class="o sm" onClick="{{ g.home }}">Back</button><h2 class="g">Notifications</h2></div>
<div class="c"><b>New application</b><span class="m">3 providers applied to Home cleaning</span></div>
<div class="c"><b>New message</b><span class="m">[Provider A] sent you a message</span></div>
<div class="c"><b>Booking reminder</b><span class="m">Logo design is due 30 Nov</span></div>
</sc-if>
<nav class="t"><button class="{{ cl.home }}" onClick="{{ g.home }}">Home</button><button class="{{ cl.track }}" onClick="{{ g.track }}">Bookings</button><button class="{{ cl.chat }}" onClick="{{ g.chat }}">Messages</button><button class="{{ cl.profile }}" onClick="{{ g.profile }}">Profile</button></nav></div>
</template>
<template id="t-provider">
<div class="s ph">
<div class="r"><b class="g">SERVICI</b><button class="o sm" onClick="{{ g.notif }}">Alerts 3</button></div>
<sc-if value="{{ v.tasks }}" hint-placeholder-val="{{ true }}">
<label class="m">Search<input class="i" placeholder="Search tasks by keyword" value="{{ q }}" onChange="{{ setQ }}"></label>
<div class="r" style="flex-wrap:wrap"><sc-for list="{{ cats }}" as="x" hint-placeholder-count="5"><button class="{{ x.cls }} sm" onClick="{{ x.pick }}">{{ x.n }}</button></sc-for></div>
<div class="r"><b class="g">Tasks for you</b><button class="o sm" onClick="{{ sortBtn }}">Sort: {{ sortLab }}</button></div>
<sc-for list="{{ tl }}" as="t" hint-placeholder-count="3"><div class="c"><div class="r"><b class="g">{{ t.t }}</b><span class="tg">{{ t.c }}</span></div><span class="m">{{ t.meta }}</span><div class="r"><b class="g">{{ t.p }} TND</b><button class="p" onClick="{{ t.open }}">View and apply</button></div></div></sc-for>
</sc-if>
<sc-if value="{{ v.detail }}" hint-placeholder-val="{{ false }}">
<div class="r"><button class="o sm" onClick="{{ g.tasks }}">Back</button><h2 class="g">{{ cur.t }}</h2></div>
<div class="r"><div class="b" style="width:44px;height:44px"></div><div class="g"><b>[Seeker name]</b><div class="m">Rating 4.6 · Verified</div></div></div>
<div class="c"><span class="m">Category: {{ cur.c }} · {{ cur.meta }}</span><b>Budget: {{ cur.p }} TND</b></div>
<label class="m">Your price (TND)<input class="i" value="{{ price }}" onChange="{{ setPrice }}"></label>
<label class="m">Personalized proposal<textarea class="i" rows="3" placeholder="Introduce yourself and explain your offer"></textarea></label>
<div class="r" style="margin-top:auto"><button class="o g" onClick="{{ g.chat }}">Message</button><button class="p g" onClick="{{ send }}">Send proposal</button></div>
</sc-if>
<sc-if value="{{ v.apps }}" hint-placeholder-val="{{ false }}">
<h2>My applications and jobs</h2>
<sc-for list="{{ al }}" as="a" hint-placeholder-count="2"><div class="c"><div class="r"><b class="g">{{ a.t }}</b><span class="tg">{{ a.st }}</span></div><span class="m">{{ a.p }} TND</span><sc-if value="{{ a.rated }}" hint-placeholder-val="{{ false }}"><span class="m">Your review: {{ a.rv }}/5</span></sc-if>
<sc-if value="{{ a.pend }}" hint-placeholder-val="{{ false }}"><button class="o sm" onClick="{{ a.demo }}">Demo: seeker accepts</button></sc-if>
<sc-if value="{{ a.acc }}" hint-placeholder-val="{{ false }}"><div class="r"><button class="p g sm" onClick="{{ a.ok }}">Accept assignment</button><button class="o g sm" onClick="{{ a.no }}">Decline</button></div></sc-if>
<sc-if value="{{ a.sch }}" hint-placeholder-val="{{ false }}"><button class="p sm" onClick="{{ a.done }}">Mark completed</button></sc-if></div></sc-for>
</sc-if>
<sc-if value="{{ v.chat }}" hint-placeholder-val="{{ false }}">
<div class="r"><h2 class="g">Messages · [Seeker]</h2><button class="o sm" onClick="{{ rf.open }}">Report</button></div>
<div class="col"><sc-for list="{{ ml }}" as="m" hint-placeholder-count="2"><div class="{{ m.cls }}">{{ m.t }}</div></sc-for></div>
<div class="r"><input class="i g" style="margin:0" placeholder="Write a message" value="{{ draft }}" onChange="{{ setDraft }}"><button class="p" onClick="{{ sendMsg }}">Send</button></div>
</sc-if>
<sc-if value="{{ v.earn }}" hint-placeholder-val="{{ false }}">
<h2>Earnings</h2>
<div class="r"><div class="st"><span class="m">Earned</span><b>{{ earned }} TND</b></div><div class="st"><span class="m">Pending</span><b>{{ pending }} TND</b></div></div>
<div class="c"><b>Payment history</b><sc-for list="{{ dl }}" as="a" hint-placeholder-count="1"><span class="m">{{ a.t }} · {{ a.p }} TND · Completed</span></sc-for><span class="m">Completed tasks appear here.</span></div>
</sc-if>
<sc-if value="{{ v.profile }}" hint-placeholder-val="{{ false }}">
<h2>My profile</h2><span class="tg" style="align-self:flex-start">Service Provider</span>
<div class="r"><div class="b" style="width:64px;height:64px"></div><b class="g">[Your name]</b></div>
<label class="m">Skills<input class="i" placeholder="Cleaning, tutoring..."></label>
<label class="m">Availability<select class="i"><option>Weekdays</option></select></label>
<div class="c"><b>Ratings and activity</b><span class="m">Average rating 4.7 · 5 jobs completed</span></div>
<a class="o" href="#welcome">Log out</a>
</sc-if>
<sc-if value="{{ v.rate }}" hint-placeholder-val="{{ false }}">
<h2>Review the service</h2><span class="m">{{ jobTitle }} · [Seeker name] · work completed</span>
<div class="r"><sc-for list="{{ stars }}" as="x" hint-placeholder-count="5"><button class="{{ x.cls }} g" onClick="{{ x.pick }}">{{ x.n }}</button></sc-for></div>
<span class="m">{{ starTxt }}</span>
<label class="m">Comment<textarea class="i" rows="4" placeholder="How was the customer and the task?"></textarea></label>
<button class="o" onClick="{{ rf.open }}">Report inappropriate behaviour</button>
<div class="r" style="margin-top:auto"><button class="o g" onClick="{{ g.apps }}">Skip</button><button class="p g" onClick="{{ submitRate }}">Submit review</button></div>
</sc-if>
<sc-if value="{{ v.report }}" hint-placeholder-val="{{ false }}">
<div class="r"><button class="o sm" onClick="{{ rf.back }}">Back</button><h2 class="g">Report a problem</h2></div>
<sc-if value="{{ rf.sent }}" hint-placeholder-val="{{ false }}"><div class="ok"><b>Report sent.</b><br>Thank you. An administrator will review it and take action if needed.</div><button class="p" onClick="{{ rf.back }}">Done</button></sc-if>
<sc-if value="{{ rf.form }}" hint-placeholder-val="{{ true }}">
<span class="m">Your report goes directly to the SERVICI administrators.</span>
<label class="m">Who are you reporting?<select class="i" data-ctl="1" onChange="{{ rf.setT }}"><sc-for list="{{ rf.tOpts }}" as="o" hint-placeholder-count="3"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.v }}</option></sc-for></select></label>

 return {open:()=>set({s:'report',rf:{t:targets[0],r:REASONS[0],d:'',sent:false,err:false},from:S.s}),

send:()=>S.draft&&set(s=>({msgs:[...s.msgs,{me:true,t:s.draft}],draft:''}))};

P.admin=(()=>{
class Component extends DCLogic {
constructor(p){ super(p); this.state={s:'dash',nc:'',
users:[{id:1,n:'[Name A]',ty:'Seeker',st:'Verified'},{id:2,n:'[Name B]',ty:'Provider',st:'Pending'},{id:3,n:'[Name C]',ty:'Provider',st:'Verified'},{id:4,n:'[Name D]',ty:'Seeker',st:'Pending'}],
reqs:[{id:1,t:'Home cleaning',o:'[Name A]',st:'Open'},{id:2,t:'Logo design',o:'[Name D]',st:'Active'},{id:3,t:'Suspicious offer',o:'[Name C]',st:'Open'}],
cats:['Cleaning','Babysitting','Tutoring','Delivery','Graphic design','Web development'],
}; }
renderVals(){
const S=this.state,set=o=>this.setState(o),v={},g={},cl={};
['dash','users','reqs','cats','reps'].forEach(k=>{v[k]=S.s===k;g[k]=()=>set({s:k});cl[k]=S.s===k?'on':'';});
const nx={Pending:'Verified',Verified:'Suspended',Suspended:'Verified'},lb={Pending:'Verify',Verified:'Suspend',Suspended:'Reinstate'};
const ul=S.users.map(u=>({...u,lab:lb[u.st],act:()=>set(s=>({users:s.users.map(x=>x.id===u.id?{...x,st:nx[u.st]}:x)}))}));

const rs=(id,st)=>()=>{const x=STORE.reports.find(r=>r.id===id);if(x)x.st=st;set({});};
const full=STORE.reports.map(r=>({...r,t:r.reason+' · '+r.target,meta:'Reported by '+r.by+' ('+r.role+') · '+r.at,open:r.st==='Open',dis:rs(r.id,'Dismissed'),take:rs(r.id,'Action taken')}));

const days=[],base={u:[3,2,4,1,3,2],q:[5,4,6,3,5,4],r:[1,0,2,1,0,1]},now=new Date(2026,10,9),DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
for(let i=0;i<7;i++){const d=new Date(now);d.setDate(now.getDate()-(6-i));const last=i===6;
 days.push({l:last?'Today':DN[d.getDay()],u:last?S.users.filter(x=>x.st==='Pending').length+1:base.u[i],q:last?S.reqs.length+2:base.q[i],r:last?STORE.reports.length:base.r[i]});}

const HOLE=/\{\{\s*([^}]+?)\s*\}\}/g,FULL=/^\{\{\s*([^}]+?)\s*\}\}$/;
const get=(sc,p)=>{p=p.trim();if(p==='true')return true;if(p==='false')return false;return p.split('.').reduce((o,k)=>o==null?o:o[k],sc);};
const kids=(n,sc)=>[...n.childNodes].flatMap(c=>rn(c,sc));
function rn(n,sc){
 if(n.nodeType===3)return [document.createTextNode(n.data.replace(HOLE,(_,p)=>{const v=get(sc,p);return v==null?'':v;}))];
 if(n.nodeType!==1)return [];
 const tag=n.tagName.toLowerCase();
 if(tag==='sc-if')return get(sc,n.getAttribute('value').match(FULL)[1])?kids(n,sc):[];
 if(tag==='sc-for'){const l=get(sc,n.getAttribute('list').match(FULL)[1])||[],as=n.getAttribute('as');return l.flatMap((it,i)=>kids(n,{...sc,[as]:it,$index:i}));}
 const el=document.createElement(tag);
 for(const a of n.attributes){
  if(a.name.startsWith('hint-'))continue;
  const f=a.value.match(FULL),v=f?get(sc,f[1]):a.value.replace(HOLE,(_,p)=>get(sc,p));
  if(a.name.startsWith('on')&&typeof v==='function')el.addEventListener(a.name==='onchange'?'input':a.name.slice(2),v);
  else if(a.name==='value'){el.value=v==null?'':v;el.dataset.ctl=1;}
  else if(v===false||v==null){}else el.setAttribute(a.name,v===true?'':v);
 }
 kids(n,sc).forEach(c=>el.appendChild(c));return [el];
}
const sig=f=>f.tagName+'|'+(f.getAttribute('placeholder')||'');
function mount(key){
 const t=document.getElementById('t-'+key),app=document.getElementById('app'),inst=new P[key]({});
 const draw=()=>{
  const old=[...app.querySelectorAll('input,textarea,select')],ai=old.indexOf(document.activeElement),a=document.activeElement;
  const ss=ai>=0?a.selectionStart:0,se=ai>=0?a.selectionEnd:0,vals=old.map(f=>[sig(f),f.value]);
  const sc=app.firstElementChild?app.firstElementChild.scrollTop:0,vv=inst.renderVals();
  app.replaceChildren(...[...t.content.childNodes].flatMap(c=>rn(c,vv)));
  const nf=[...app.querySelectorAll('input,textarea,select')];
  nf.forEach((f,i)=>{if(!f.dataset.ctl&&vals[i]&&vals[i][0]===sig(f))f.value=vals[i][1];});
  if(ai>=0&&nf[ai]){nf[ai].focus();try{nf[ai].setSelectionRange(ss,se);}catch(e){}}
  if(app.firstElementChild)app.firstElementChild.scrollTop=sc;
 };
 inst._r=draw;draw();
}
const DESK={adminlogin:1,admin:1},TAB={welcome:'welcome',seeker:'seeker',provsetup:'provider',provider:'provider',adminlogin:'admin',admin:'admin'};
const route=()=>{const h=(location.hash||'#welcome').slice(1),k=P[h]?h:'welcome';
 document.getElementById('device').className=DESK[k]?'desk':'phone';document.body.className=DESK[k]?'d':'';
 document.querySelectorAll('.seg a').forEach(a=>a.toggleAttribute('data-on',a.dataset.g===TAB[k]));
 mount(k);window.scrollTo(0,0);};
addEventListener('hashchange',route);route();
